name: Check

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Confirms the model file parses. (A full run downloads years of play-by-play, so it is not done here.)
      - run: python -m py_compile nfl_model.py
